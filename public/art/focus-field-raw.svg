<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="title desc">
  <title id="title">Raw focus field</title>
  <desc id="desc">An unresolved editorial field of offset fragments, scanning lines, and a central focus frame.</desc>
  <defs>
