    <path d="M518 354v-44h44M1038 310h44v44M1082 646v44h-44M562 690h-44v-44" stroke="#c7ff45" stroke-width="5"/>
    <circle cx="800" cy="500" r="44" stroke="#0b0d0c" stroke-opacity=".72"/>
    <circle cx="800" cy="500" r="4" fill="#0b0d0c" stroke="none"/>
    <path d="M736 500h128M800 436v128" stroke="#0b0d0c" stroke-opacity=".32"/>
  </g>
  <g fill="#f1ebdd" fill-opacity=".62" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="3">
    <text x="94" y="101">FIELD / RESOLVED</text>
    <text x="1316" y="908">01:LOCKED</text>
  </g>
